name: Debug Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.10.2

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Create Release v0.1.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v0.1.0 --yes 2>/dev/null || true
          gh release create v0.1.0             --title "Screen Translator v0.1.0"             --notes "Debug build from overlay-translator main branch"
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n1)
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          cp "$APK" ScreenTranslator-debug.apk
          echo "$SHA  ScreenTranslator-debug.apk" > ScreenTranslator-debug.apk.sha256
          gh release upload v0.1.0 ScreenTranslator-debug.apk ScreenTranslator-debug.apk.sha256 --clobber

      - name: Show result
        run: |
          echo "APK: ScreenTranslator-debug.apk"
          echo "Release: https://github.com/yanfyanqiu/overlay-translator/releases/tag/v0.1.0"
