.github/workflows/debug-build.yml
name: Build debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Clone llama.cpp
        run: |
          git clone --depth=1 https://github.com/ggerganov/llama.cpp.git "${{ github.workspace }}/llama.cpp"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;25.1.8937393"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV

      - name: Setup CMake
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1"

      - name: Build
        env:
          LLAMA_SRC: ${{ github.workspace }}/llama.cpp
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          cd "${{ github.workspace }}"
          # Clean C++ build cache to force rebuild with our fixed files
          rm -rf lib/.cxx/
          rm -rf app/build/
          chmod +x gradlew
          # Capture FULL log, tee + redirect both to terminal and file
          ./gradlew assembleDebug --no-daemon 2>&1 | tee gradle.log ; EXIT_CODE=${PIPESTATUS[0]}
          echo "GRADLE_EXIT=$EXIT_CODE" >> $GITHUB_ENV
          exit $EXIT_CODE

      - name: Check result
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "BUILD SUCCESS"
            echo "APK_SIZE=$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)" >> $GITHUB_ENV
          else
            echo "BUILD FAILED - gradle.log errors:"
            grep -i "error:\|BUILD FAILED\|FAILED\|Exception\|exception" gradle.log | tail -50 || true
            echo "=== Last 30 lines ==="
            tail -30 gradle.log || true
            exit 1
          fi

      - name: Upload to Release
        if: success()
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          TAG="v0.1.0"
          gh release view "$TAG" &>/dev/null ||             gh release create "$TAG" --title "Offline Interpreter v0.1.0" --draft
          gh release delete-asset "$TAG" OfflineInterpreter-debug.apk --yes 2>/dev/null || true
          cp "$APK" OfflineInterpreter-debug.apk
          gh release upload "$TAG" OfflineInterpreter-debug.apk --clobber
          echo "APK_UPLOADED=1" >> $GITHUB_ENV

      - name: Push build log to branch on failure
        if: failure()
        run: |
          mkdir -p build-log
          cp gradle.log build-log/build-error.log 2>/dev/null || echo "NO_LOG" > build-log/build-error.log
          echo "${{ github.run_number }}" > build-log/build-number.txt
          echo "${{ github.run_id }}" > build-log/run-id.txt
          git config --local user.email "qclaw@localhost"
          git config --local user.name "QClaw CI"
          git checkout -B build-log
          git add -f build-log/
          git commit -m "Build log ${{ github.run_id }}"
          git push --force origin build-log || true
